services:
  sso:
    container_name: TokenCraft
    build:
      context: .
      dockerfile: dockerfile
    image: ghcr.io/n0f4ph4mst3r/tokencraft:latest
    restart: always

    environment:
      HTTP_SERVER_ADDRESS: 0.0.0.0
      HTTP_SERVER_PORT: ${HTTP_SERVER_PORT}
      CONFIG_PATH: /config/config.yaml
      DATABASE_URL: "${DATABASE_URL}"
      CACHE_URL: "${CACHE_URL}"
      APP_SECRET: "${APP_SECRET}"
      RS256_PRIVATE_KEY_PATH: /config/private.pem
    volumes:
      - ${HOST_CONFIG_PATH}:/config/config.yaml:ro
      - ${HOST_PRIVATE_KEY_PATH-/dev/null}:/config/private.pem:ro
    ports:
      - "${HTTP_SERVER_PORT}:50051"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:18-alpine
    container_name: tokencraft_db
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"

  redis:
    image: valkey/valkey:9.0.3
    container_name: tokencraft_cache
    command: ["valkey-server"]
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: